name: aqarya

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqarya}
      POSTGRES_USER: ${POSTGRES_USER:-aqarya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqarya} -d ${POSTGRES_DB:-aqarya}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aqarya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aqarya}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BLOCKCHAIN_PROVIDER: ${BLOCKCHAIN_PROVIDER:-mock-chain}
      BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-production}
      BLOCKCHAIN_RECORD_PREFIX: ${BLOCKCHAIN_RECORD_PREFIX:-aqarya-vrf}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [internal]

  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      # Keep Aqarya private to this VPS. The host reverse proxy owns ports 80/443.
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
