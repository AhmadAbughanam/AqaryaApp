name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish dist/ to the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Deploy secrets are missing. In the repo: Settings → Secrets and variables → Actions → Secrets, add DEPLOY_HOST (aqarya.online), DEPLOY_USER (root), DEPLOY_SSH_KEY (the private key). DEPLOY_PORT is optional."
            exit 1
          fi

          test -f dist/index.html

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH="ssh -p $PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          REMOTE="$SSH_USER@$HOST"

          $SSH "$REMOTE" 'command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync); mkdir -p /opt/aqarya/dist'
          rsync -az --delete -e "$SSH" dist/ "$REMOTE:/opt/aqarya/dist/"
          $SSH "$REMOTE" 'cd /opt/aqarya && GIT_TERMINAL_PROMPT=0 git fetch origin -q && git reset --hard -q origin/main || true'
          $SSH "$REMOTE" 'docker exec aqarya-web-1 nginx -s reload 2>/dev/null || docker restart aqarya-web-1'

          echo "Deployed ${GITHUB_SHA:0:7}. Live JS bundle:"
          sleep 2
          curl -s https://aqarya.online/ | grep -o 'assets/index-[^"]*\.js' || true
